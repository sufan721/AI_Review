# Testcontainers project-level configuration.
#
# Disable the resource reaper (Ryuk). The China registry mirrors configured in
# the Docker daemon cannot serve `testcontainers/ryuk`, and when that image is
# re-tagged from a mirror its RepoDigest still points at the mirror rather than
# docker.io, so Testcontainers' local-image check misses it and stalls 2 minutes
# trying to pull. Disabling Ryuk is safe for tests: containers are simply left
# running afterwards. Clean up with: docker rm -f $(docker ps -aq)
ryuk.disabled=true
